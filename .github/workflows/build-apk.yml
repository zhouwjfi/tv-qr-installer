name: Build APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 构建 release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease

      - name: 签名（有 KEYSTORE_BASE64 secret 时）
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          UNSIGNED=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::未配置 KEYSTORE_BASE64，产物为未签名 APK，无法直接安装"
            cp "$UNSIGNED" tv-qr-installer-unsigned.apk
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$BT/apksigner" sign \
            --ks keystore.jks \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out tv-qr-installer-release.apk \
            "$UNSIGNED"
          "$BT/apksigner" verify tv-qr-installer-release.apk
          rm -f keystore.jks

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: tv-qr-installer
          path: |
            tv-qr-installer-release.apk
            tv-qr-installer-unsigned.apk
          if-no-files-found: error

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: tv-qr-installer-*.apk
          generate_release_notes: true
