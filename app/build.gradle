plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zhouwj.tvinstaller'
    compileSdk 34

    defaultConfig {
        applicationId "com.zhouwj.tvinstaller"
        minSdk 21
        targetSdk 34
        versionCode 6
        versionName "1.5"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.google.zxing:core:3.5.3'
}
